<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="botGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0088cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066aa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="qwenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- Qwen Code symbol (stylized terminal/code) -->
  <g transform="translate(256, 256)">
    <!-- Code brackets -->
    <path d="M -80 -60 L -120 0 L -80 60" stroke="url(#qwenGradient)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M 80 -60 L 120 0 L 80 60" stroke="url(#qwenGradient)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Terminal cursor -->
    <rect x="-30" y="-20" width="60" height="40" rx="4" fill="url(#qwenGradient)" opacity="0.3"/>
    <rect x="-10" y="-10" width="20" height="20" rx="2" fill="url(#qwenGradient)" filter="url(#glow)"/>
  </g>
  
  <!-- Telegram Bot overlay (paper plane + bot antenna) -->
  <g transform="translate(256, 256)">
    <!-- Bot head (circle with antenna) -->
    <circle cx="0" cy="-100" r="35" fill="url(#botGradient)" filter="url(#glow)"/>
    <line x1="0" y1="-135" x2="0" y2="-155" stroke="url(#botGradient)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-160" r="8" fill="url(#botGradient)"/>
    
    <!-- Bot eyes -->
    <ellipse cx="-12" cy="-105" rx="5" ry="7" fill="#ffffff"/>
    <ellipse cx="12" cy="-105" rx="5" ry="7" fill="#ffffff"/>
    
    <!-- Paper plane (Telegram symbol) -->
    <path d="M -100 80 L 60 0 L -100 -80 L -60 0 Z" fill="url(#botGradient)" filter="url(#glow)" transform="rotate(-15)"/>
    <path d="M -60 0 L 20 40 L 60 0" stroke="url(#botGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Connection lines between bot and code -->
  <g opacity="0.4">
    <line x1="256" y1="180" x2="256" y2="220" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="240" y1="190" x2="240" y2="210" stroke="#0088cc" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="272" y1="190" x2="272" y2="210" stroke="#0088cc" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
</svg>
