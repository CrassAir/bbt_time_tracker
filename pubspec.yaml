name: bbt_time_tracker
description: "Support for dev"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.1.2
  url_launcher: ^6.3.2
  linkable: ^3.0.2
  flutter_swipe_action_cell: ^3.1.6

  # DB
  objectbox: ^5.2.0
  objectbox_flutter_libs: any
  path_provider: ^2.1.5

  audioplayers: ^6.5.1
  window_manager: ^0.3.8
  windows_single_instance: ^1.0.1
  share_plus: ^12.0.1
  excel: ^4.0.6
  open_file: ^3.5.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  objectbox_generator: any

flutter:
  uses-material-design: true

  assets:
    - assets/mp3/