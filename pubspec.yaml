name: qwen_time_tracker
description: "Unified Time Tracker + Qwen Bot desktop application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # From remote_qwen
  televerse: ^3.2.0
  shared_preferences: ^2.3.4
  intl: ^0.20.2
  path: ^1.9.1
  tray_manager: ^0.2.4
  window_manager: ^0.5.1
  win32: ^5.5.0
  reorderable_tabbar: ^1.0.0
  package_info_plus: ^8.1.2
  process_run: ^1.3.1+1
  file_picker: ^10.3.10
  image: ^4.3.0
  
  # From bbt_time_tracker
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.1.2
  url_launcher: ^6.3.2
  linkable: ^3.0.2
  flutter_swipe_action_cell: ^3.1.6
  objectbox: ^5.2.0
  objectbox_flutter_libs: any
  path_provider: ^2.1.5
  audioplayers: ^6.5.1
  windows_single_instance: ^1.0.1
  share_plus: ^12.0.1
  excel: ^4.0.6
  open_file: ^3.5.11
  args: ^2.4.2  # Для парсинга аргументов командной строки

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.11
  objectbox_generator: any

flutter_launcher_icons:
  android: false
  ios: false
  windows:
    generate: true
    image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/mp3/
